<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每周反馈 · 周评估表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Noto Sans SC', -apple-system, sans-serif; background:#f0f2f5; color:#2d3436; line-height:1.85; padding:20px 12px; display:flex; justify-content:center; }
  .page { max-width:520px; width:100%; background:#fff; border-radius:16px; padding:28px 24px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  h1 { font-size:20px; font-weight:700; text-align:center; margin-bottom:4px; }
  .sub { text-align:center; font-size:12px; color:#999; margin-bottom:20px; }
  .q { margin-bottom:18px; }
  .q label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  .q input[type="text"], .q input[type="number"], .q select, .q textarea {
    width:100%; border:1.5px solid #d0d5d8; border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; background:#f8faf9;
  }
  .q textarea { min-height:64px; resize:vertical; }
  .scale { display:flex; gap:6px; }
  .scale-btn { flex:1; padding:10px 0; text-align:center; border:1.5px solid #d0d5d8; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; background:#f8faf9; transition:all .15s; user-select:none; }
  .scale-btn:hover { border-color:#2c5f4a; }
  .scale-btn.sel { background:#2c5f4a; color:#fff; border-color:#2c5f4a; }
  input[type="radio"] { display:none; }
  .btn { width:100%; padding:14px; background:linear-gradient(135deg,#2c5f4a,#1a3c2e); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; letter-spacing:1px; margin-top:8px; }
  .btn:disabled { opacity:.5; }
  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:10px; font-size:14px; font-weight:600; z-index:999; }
  .toast.ok { background:#d4edda; color:#155724; }
  .toast.err { background:#f8d7da; color:#721c24; }
</style>
</head>
<body>
<div class="page">

<h1>每周反馈</h1>
<div class="sub">花 2 分钟填一下，教练会根据这个调整下周计划</div>

<form id="weekForm">

  <div class="q">
    <label>👤 你的名字</label>
    <input type="text" id="name" placeholder="填你用的名字" required>
  </div>

  <div class="q">
    <label>📅 反馈的是哪一周</label>
    <input type="text" id="weekRange" placeholder="比如：7月5日 — 7月12日" required>
  </div>

  <div class="q">
    <label>⚖️ 这一周的体重变化</label>
    <select id="weightChange" required>
      <option value="">-- 选一个 --</option>
      <option>一直在降，每周大概 1-2 斤</option>
      <option>有降但比较慢，不到 1 斤</option>
      <option>基本没动，卡住了</option>
      <option>反而涨了一点</option>
    </select>
  </div>

  <div class="q">
    <label>😴 这周睡得怎么样（1=很差，10=很好）</label>
    <div class="scale" id="sleepScale"></div>
  </div>

  <div class="q">
    <label>💩 这周排便怎么样（1=便秘，10=每天顺畅）</label>
    <div class="scale" id="bowelScale"></div>
  </div>

  <div class="q">
    <label>🧘 这周情绪怎么样（1=很烦躁，10=很平稳）</label>
    <div class="scale" id="moodScale"></div>
  </div>

  <div class="q">
    <label>🍽️ 三餐执行度（大概执行了多少）</label>
    <select id="adherence" required>
      <option value="">-- 选一个 --</option>
      <option>90% 以上，基本都按计划吃了</option>
      <option>70-80%，偶尔跑偏</option>
      <option>50% 左右，这周事多没顾上</option>
      <option>不到一半，很难执行</option>
    </select>
  </div>

  <div class="q">
    <label>🤔 有没有特别想吃什么，或者特别不想吃什么</label>
    <textarea id="foodNote" placeholder="比如：最近特别想吃甜的 / 吃不下早饭 / 看到肉就腻……没有就填无"></textarea>
  </div>

  <div class="q">
    <label>❗ 身体有没有不舒服（头晕/乏力/胃胀/失眠加重等）</label>
    <textarea id="symptom" placeholder="没有就填无"></textarea>
  </div>

  <div class="q">
    <label>💬 还有什么想跟教练说的</label>
    <textarea id="note" placeholder="没有就填无"></textarea>
  </div>

  <button type="button" class="btn" onclick="copyData()">📋 复制数据，微信发给教练</button>
</form>

</div>

<script>
// 生成 1-10 量表
['sleepScale','bowelScale','moodScale'].forEach(id => {
  const el = document.getElementById(id);
  for (let i=1; i<=10; i++) {
    const d = document.createElement('div');
    d.className = 'scale-btn'; d.textContent = i;
    d.onclick = function() {
      el.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('sel'));
      d.classList.add('sel');
      el.setAttribute('data-val', i);
    };
    el.appendChild(d);
  }
});

function getVal(id) {
  return document.getElementById(id).value.trim() || '未填';
}

function copyData() {
  const name = getVal('name');
  if (!name) { showToast('请先填名字', 'err'); return; }

  const week = getVal('weekRange') || new Date().toISOString().slice(0,10);

  const lines = [
    '📅 ' + week + ' 反馈',
    '━━━━━━━━━━━━━━━━',
    '👤 ' + name,
    '',
    '⚖️ 体重变化：' + getVal('weightChange'),
    '😴 睡眠(1-10)：' + (document.getElementById('sleepScale').getAttribute('data-val') || '未选'),
    '💩 排便(1-10)：' + (document.getElementById('bowelScale').getAttribute('data-val') || '未选'),
    '🧘 情绪(1-10)：' + (document.getElementById('moodScale').getAttribute('data-val') || '未选'),
    '🍽️ 执行度：' + getVal('adherence'),
    '🤔 饮食偏好：' + getVal('foodNote'),
    '❗ 不舒服：' + getVal('symptom'),
    '💬 想说的：' + getVal('note'),
    '━━━━━━━━━━━━━━━━',
  ];

  const text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制，去微信粘贴发给教练', 'ok'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制，去微信粘贴发给教练', 'ok');
  }
}

function showToast(msg, type) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
